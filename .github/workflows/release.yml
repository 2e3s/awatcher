name: Release
permissions:
  contents: write
  id-token: write
  attestations: write
on:
  push:
    tags:
      - 'v[0-9]*.*.*'
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    # 22.04 is the earliest version with OpenSSL 3
    runs-on: ubuntu-22.04
    env:
      AW_WEBUI_DIR: ${{ github.workspace }}/aw-webui/dist
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          sudo apt-get install build-essential -y
          sudo apt-get install libdbus-1-dev -y
          sudo apt-get install libssl-dev -y
          sudo apt-get install pkg-config -y
          sudo apt-get install libxkbcommon-dev -y
      - run: cargo install cargo-deb
      - run: cargo install cargo-generate-rpm

      # Build aw-webui
      - name: Checkout aw-webui
        uses: actions/checkout@v4
        with:
          repository: ActivityWatch/aw-webui
          path: aw-webui
          ref: 291da6f2c5e7a6b896f23a4eec5ffed9874321ba
          submodules: true
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Copy logo
        run: cp media/logo/logo.png static/
        working-directory: aw-webui
      - run: npm ci
        working-directory: aw-webui
      - run: npm run build
        working-directory: aw-webui

      # Buil and upload binaries
      - uses: Swatinem/rust-cache@v2
      - name: cargo build bundle
        run: cargo build --release --features=bundle

      - run: zip "awatcher-bundle.zip" awatcher
        working-directory: target/release

      # cargo-generate-rpm packages whatever is currently in target/release/awatcher
      - run: cargo generate-rpm --variant=bundle

      - name: cargo build bare
        run: cargo build --release

      - run: cargo generate-rpm --variant=module

      - run: mv awatcher aw-awatcher
        working-directory: target/release
      - run: zip "aw-awatcher.zip" "aw-awatcher"
        working-directory: target/release

      - run: cargo deb --variant=bundle

      - run: cargo deb --variant=module

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/release/awatcher-bundle.zip
            target/release/aw-awatcher.zip
            target/generate-rpm/*.rpm
            target/debian/*.deb

      # Assets go to a draft release, which is published manually after editing the notes.
      # With release immutability enabled, assets can't be added after publishing.
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            target/release/awatcher-bundle.zip \
            target/release/aw-awatcher.zip \
            target/generate-rpm/*.rpm \
            target/debian/*.deb
